<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En uge i musik · Tre måder at vise data</title>
  <link rel="stylesheet" href="../../../main.css">
  <link rel="stylesheet" href="demo.css">
  <script defer src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>

<body>
  <main class="demo">
    <a href="../../index.html#uge-45">Tilbage til forløbet</a>
    <header>
      <p class="eyebrow">Uge 45 · Visualisering af data</p>
      <h1>En uge i musik</h1>
      <p>Samme tal, tre forskellige udtryk. Hvad er lettest at aflæse?</p>
      <p>Opdigtede data om minutter med musik pr. dag.</p>
    </header>
    <section class="chart-panel" aria-label="Visualisering af minutter med musik">
      <div id="knapper" role="group" aria-label="Vælg visning"></div>
      <div id="diagram" role="img" aria-label="Musik i minutter: mandag 30, tirsdag 65, onsdag 45, torsdag 90, fredag 120, lørdag 160, søndag 50."></div>
      <p id="forklaring" aria-live="polite"></p>
      <noscript>Slå JavaScript til for at se diagrammet. Minutter pr. dag:
        mandag 30, tirsdag 65, onsdag 45, torsdag 90, fredag 120, lørdag 160, søndag 50.</noscript>
    </section>
    <p>Hvilken dag skiller sig ud? I hvilken visning er forskellen lettest at se?</p>
    <p><a href="https://github.com/louissse/programmering-b-2026/tree/main/02_data/eksempler/03_visualiseringsdemo">Find demoens kode på GitHub</a></p>
  </main>
</body>
